# Nginx config for the Forgotten Photocards SPA.
#
# Serves static files from /usr/share/nginx/html and proxies /api → backend.
# The "backend" upstream is resolved through Docker's internal DNS — the name
# must match the service name in docker-compose.yml.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text-y assets
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # CSS / fonts / images — long-cache as immutable (content under the same
    # URL won't change without an explicit redeploy with a new filename).
    location ~* \.(?:css|svg|woff2?|ttf|eot|ico|png|jpe?g|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # App JS (api.js + the esbuild bundle /app.js). Stable filenames without
    # content hashes, so the browser must revalidate to pick up rebuilds.
    # ETag-based revalidation is cheap (304 on no change).
    location ~* \.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    # ── API proxy ──────────────────────────────────────────────────
    # Adjust "backend:8000" if you name your service differently in
    # docker-compose. The trailing slash on proxy_pass strips /api/.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── SPA fallback ───────────────────────────────────────────────
    # Routing happens via hash (#/post/erevan), so this is mostly a safety
    # net for unknown paths and future history-mode routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
