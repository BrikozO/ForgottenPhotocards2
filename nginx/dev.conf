# Reverse-proxy config: dev / plain HTTP.
#
# Single entrypoint on :80. /api → backend, everything else → frontend.
# No TLS, no redirects, no fancy headers. For prod see prod.conf.

upstream fpc_backend  { server backend:8000; }
upstream fpc_frontend { server frontend:80; }

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 16M;

    location /api/ {
        proxy_pass         http://fpc_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Scraped post photos — backend writes JPEGs to the shared backend_data
    # volume (mounted ro here), nginx serves them directly.
    location /media/ {
        alias /srv/backend/data/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        proxy_pass         http://fpc_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
