# Reverse-proxy config: prod / TLS termination.
#
# Mount certs at /etc/nginx/certs/{fullchain.pem,privkey.pem}
# (e.g. via Let's Encrypt host volume — see docker-compose.prod.yml).

upstream fpc_backend  { server backend:8000; }
upstream fpc_frontend { server frontend:80; }

# Plain HTTP — only redirect to HTTPS. Keep ACME challenge path open so
# certbot can renew without bringing nginx down.
server {
    listen 80 default_server;
    server_name zabytye.ru www.zabytye.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://zabytye.ru$request_uri;
    }
}

# Canonicalize www → apex on HTTPS too.
server {
    listen 443 ssl;
    http2 on;
    server_name www.zabytye.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    return 301 https://zabytye.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name zabytye.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header X-Frame-Options           SAMEORIGIN                             always;
    add_header Referrer-Policy           strict-origin-when-cross-origin        always;

    client_max_body_size 16M;

    location /api/ {
        proxy_pass         http://fpc_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Scraped post photos — backend writes JPEGs to the shared backend_data
    # volume (mounted ro here), nginx serves them directly.
    location /media/ {
        alias /srv/backend/data/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass         http://fpc_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
