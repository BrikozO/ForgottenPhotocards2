# Dev stack: nginx → {frontend, backend}, plain HTTP on :80.
#
# For prod (TLS on 443) overlay docker-compose.prod.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
  # VLESS → local HTTP proxy on the docker network. Backend uses it via
  # HTTPS_PROXY to reach t.me from regions where it is blocked.
  #
  # xray/config.json is gitignored. Copy xray/config.example.json to
  # xray/config.json and fill in the VLESS credentials before bringing
  # this stack up (or scp the populated config to the server out-of-band).
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: fpc-xray
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    expose:
      - "1080"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fpc-backend
    expose:
      - "8000"
    volumes:
      - backend_data:/srv/backend/data
    environment:
      FPC_DATABASE_URL: sqlite+aiosqlite:////srv/backend/data/fpc.db
      # Route outbound HTTP(S) traffic through Xray. NO_PROXY keeps internal
      # service-to-service calls direct.
      HTTPS_PROXY: "http://xray:1080"
      HTTP_PROXY:  "http://xray:1080"
      NO_PROXY:    "localhost,127.0.0.1,backend,frontend,nginx,xray"
    depends_on:
      - xray
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: fpc-frontend
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
    container_name: fpc-nginx
    ports:
      - "80:80"
    # Read-only mount of the backend's data volume so nginx can serve scraped
    # post photos directly (see `location /media/` in dev.conf / prod.conf).
    volumes:
      - backend_data:/srv/backend/data:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  backend_data:
